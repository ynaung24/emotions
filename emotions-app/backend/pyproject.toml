[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-evaluator-backend"
version = "0.2.0"
description = "Interview response evaluator API - deterministic scoring with an optional LLM judge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
    "sentence-transformers>=3.3",
    "spacy>=3.8",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "textstat>=0.7.4",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "faster-whisper>=1.1",
    "transformers>=4.46",
]

[project.optional-dependencies]
judge = [
    "anthropic>=0.40",
    "openai>=1.54",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load real ML models (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
